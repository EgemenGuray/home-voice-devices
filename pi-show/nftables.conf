#!/usr/sbin/nft -f
# Inbound: only Home Assistant may reach the Wyoming satellite; everything else is dropped.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr @HA_HOST_IP@ tcp dport 10700 accept
    udp dport 5353 accept          # mDNS so HA can discover the satellite
    icmp type echo-request limit rate 5/second accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
